[package]
name = "code-intelligence"
version = "0.1.1"
edition = "2021"
default-run = "code-intelligence"
description = "Semantic Code Intelligence Engine for AI"
authors = ["Your Name"]
license = "MIT"

[dependencies]
# Core
clap = { version = "4.4", features = ["derive"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
lazy_static = "1.4"
hex = "0.4"
once_cell = "1.19"

# Modern grammar ecosystem alignment
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-dart = "0.1"
tree-sitter-php = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"

# Graph
petgraph = { version = "0.6", features = ["serde-1"] }

# Parallel
rayon = "1.8"
dashmap = "5"

# Compression
flate2 = "1"
base64 = "0.21"

# Hashing
blake3 = "1"
sha2 = "0.10"

# Allocation
bumpalo = "3"

# Regex
regex = "1"
aho-corasick = "1"

# File walking
walkdir = "2"
ignore = "0.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"
async-trait = "0.1.91"
futures = "0.3.33"
tokio = { version = "1", features = ["rt", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }

# Terminal UI
ratatui = "0.26"
crossterm = "0.27"

tempfile = "3"      # For temporary files
ctrlc = "3"         # For signal handling

# ML / Linear Algebra
linfa = { version = "0.7", features = ["serde"] }
linfa-logistic = "0.7"
linfa-trees = "0.7"
ndarray = "0.15"
rand = { version = "0.8", features = ["small_rng"] }
indicatif = "0.18.6"

streaming-iterator = "0.1"


[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tokio = { version = "1", features = ["rt", "macros"] }
rand = { version = "0.8", features = ["small_rng"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "compression"
harness = false
path = "benches/compression.rs"

[features]
default = ["ml", "cli"]
ml = []
cli = []
advanced = []

[[test]]
name = "property_tests"
path = "tests/property_tests.rs"

[[test]]
name = "fuzz_tests"
path = "tests/fuzz_tests.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# BINARIES

# Core CLI
[[bin]]
name = "ci"
path = "src/bin/ci/main.rs"

# Core Analysis
[[bin]]
name = "dead_code_check"
path = "src/bin/dead_code_check.rs"

[[bin]]
name = "dead_code_dashboard"
path = "src/bin/dead_code_dashboard.rs"

[[bin]]
name = "dedup_check"
path = "src/bin/dedup_check.rs"

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "data"
path = "src/bin/data.rs"
