[package]
name = "code-intelligence"
version = "0.1.0"
edition = "2021"
default-run = "code-intelligence"
description = "Semantic Code Intelligence Engine for AI"
authors = ["Your Name"]
license = "MIT"

[dependencies]
# Core
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
lazy_static = "1.4"
hex = "0.4"
once_cell = "1.19"  # ⭐ NEW

# Parsing
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"

# Graph
petgraph = { version = "0.6", features = ["serde-1"] }

# Parallel
rayon = "1.8"
dashmap = "5"

# Compression
flate2 = "1"
base64 = "0.21"

# Hashing
blake3 = "1"
sha2 = "0.10"

# Allocation
bumpalo = "3"

# Regex
regex = "1"
aho-corasick = "1"

# File walking
walkdir = "2"
ignore = "0.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"
async-trait = "0.1.91"
futures = "0.3.33"
tokio = { version = "1", features = ["rt", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }

# Terminal UI
ratatui = "0.26"
crossterm = "0.27"

# ML / Linear Algebra
linfa = { version = "0.7", features = ["serde"] }
linfa-logistic = "0.7"
linfa-trees = "0.7"
ndarray = "0.15"
rand = { version = "0.8", features = ["small_rng"] }


[dev-dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "compression"
harness = false
path = "benches/compression.rs"

[features]
default = ["ml"]
ml = []

[[bin]]
name = "analyze_features_per_language"
path = "src/bin/analyze_features_per_language.rs"

[[bin]]
name = "calibrate_model"
path = "src/bin/calibrate_model.rs"

[[bin]]
name = "collect_training_data"
path = "src/bin/collect_training_data.rs"

[[bin]]
name = "dead_code_check"
path = "src/bin/dead_code_check.rs"

[[bin]]
name = "dead_code_dashboard"
path = "src/bin/dead_code_dashboard.rs"

[[bin]]
name = "dedup_check"
path = "src/bin/dedup_check.rs"

[[bin]]
name = "evaluate_per_language"
path = "src/bin/evaluate_per_language.rs"

[[bin]]
name = "feature_ablation"
path = "src/bin/feature_ablation.rs"

[[bin]]
name = "merge_all_training_data"
path = "src/bin/merge_all_training_data.rs"

[[bin]]
name = "merge_training_data"
path = "src/bin/merge_training_data.rs"

[[bin]]
name = "model_comparison"
path = "src/bin/model_comparison.rs"

[[bin]]
name = "train_duplicate_model"
path = "src/bin/train_duplicate_model.rs"

[[bin]]
name = "train_model"
path = "src/bin/train_model.rs"

[[bin]]
name = "training_data_exporter"
path = "src/bin/training_data_exporter.rs"

[[bin]]
name = "tune_threshold"
path = "src/bin/tune_threshold.rs"
