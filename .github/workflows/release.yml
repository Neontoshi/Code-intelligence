name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ci
            asset_name: ci
            asset_path: ci
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: ci
            asset_name: ci_macos_intel
            asset_path: ci_macos_intel
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: ci
            asset_name: ci_macos_arm64
            asset_path: ci_macos_arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: ci.exe
            asset_name: ci_windows_x86_64.exe
            asset_path: ci_windows_x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary asset
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_path }}
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifact paths
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
